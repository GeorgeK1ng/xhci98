name: Build NT 5.x targets

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-xp-x86
            cpu: x86
            target: WXP
            object: objfre_WXP_x86
          - name: server-2003-x86
            cpu: x86
            target: WNET
            object: objfre_WNET_x86
          - name: windows-xp-x64
            cpu: x64
            target: WNET
            object: objfre_WNET_amd64
    env:
      WDK71_ISO_URL: https://github.com/KunYi/WDK_DDKArchive/releases/download/WDK_v7.1.0/GRMWDK_EN_7600_1.ISO
      WDK_INSTALL_DIR: C:\WinDDK

    steps:
      - uses: actions/checkout@v4

      - name: Download and install WDK 7.1
        shell: pwsh
        run: |
          $iso = Join-Path $env:RUNNER_TEMP 'wdk71.iso'
          $media = Join-Path $env:RUNNER_TEMP 'wdk71'
          Invoke-WebRequest -Uri $env:WDK71_ISO_URL -OutFile $iso
          New-Item -ItemType Directory -Force -Path $media | Out-Null
          7z.exe x $iso "-o$media" -y | Out-Null
          $setup = Get-ChildItem $media -Recurse -Filter KitSetup.exe | Select-Object -First 1
          if (-not $setup) { throw 'KitSetup.exe was not found in the WDK media.' }
          $process = Start-Process $setup.FullName -ArgumentList @(
            '/no-view', '/ui-level', 'EXPRESS', '/install', 'ALL',
            '/install-location', $env:WDK_INSTALL_DIR
          ) -WorkingDirectory $setup.DirectoryName -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "KitSetup failed with $($process.ExitCode)." }
          $setenv = Get-ChildItem $env:WDK_INSTALL_DIR -Recurse -Filter setenv.bat |
            Select-Object -First 1
          if (-not $setenv) { throw 'setenv.bat was not installed.' }
          "DDKROOT=$($setenv.Directory.Parent.FullName)" | Out-File $env:GITHUB_ENV -Append -Encoding ascii

      - name: Build ${{ matrix.name }}
        shell: cmd
        run: |
          call "%DDKROOT%\bin\setenv.bat" %DDKROOT% fre ${{ matrix.cpu }} ${{ matrix.target }} no_oacr
          if errorlevel 1 exit /b 1
          call scripts\make-usbport-lib-wdk.cmd ${{ matrix.cpu }}
          if errorlevel 1 exit /b 1
          cd /d src
          build -ceZ
          if errorlevel 1 exit /b 1

      - name: Collect driver
        shell: pwsh
        run: |
          $driver = Get-ChildItem src -Recurse -Filter xhci98.sys |
            Where-Object FullName -Like '*\${{ matrix.object }}\*' |
            Select-Object -First 1
          if (-not $driver) { throw 'The expected xhci98.sys output was not found.' }
          New-Item artifact -ItemType Directory -Force | Out-Null
          Copy-Item $driver.FullName artifact\xhci98.sys
          Copy-Item src\xhci98.inf artifact\xhci98.inf

      - uses: actions/upload-artifact@v4
        with:
          name: xhci98-${{ matrix.name }}
          path: artifact
